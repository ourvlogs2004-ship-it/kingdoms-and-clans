<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14241d">
<title>Kingdoms & Clans: Frontier</title>
<style>
:root{--gold:#ffda65;--green:#83f06b;--cream:#fff5d6;--ink:#14241d;--glass:#12271eeF;--muted:#c5ddc9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10251b;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:manipulation}button{font:inherit;color:inherit;border:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#77bf61}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.resources{display:flex;gap:5px;flex-wrap:wrap}.res{background:#14271ff2;border:1px solid #eaffd46e;border-radius:12px;padding:7px 10px;box-shadow:0 4px 0 #07150e88;font-size:clamp(11px,2.6vw,15px);font-weight:950;white-space:nowrap;text-shadow:0 1px 2px #0008}.res b{color:var(--gold)}
.iconbtn{pointer-events:auto;background:linear-gradient(#577963,#243f30);border:1px solid #d9f7ce;border-radius:12px;padding:9px 12px;font-weight:1000;box-shadow:0 4px 0 #0b1e14}
#topright{display:flex;gap:6px}
#bottom{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));padding:7px 8px;display:flex;gap:6px;justify-content:center;pointer-events:none}
.navbtn{pointer-events:auto;flex:1;max-width:150px;min-width:0;min-height:58px;border-radius:14px;background:linear-gradient(#50775a,#213f2c);border:2px solid #c8eab3;box-shadow:0 4px 0 #102819;padding:4px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;font-size:clamp(10px,2.6vw,13px);font-weight:1000;text-shadow:0 2px #0008}.navbtn .ico{font-size:23px;line-height:1.1}.navbtn:active{transform:translateY(3px);box-shadow:0 1px #102819}
#context{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:#14291feF;border:1px solid #eaffd477;border-radius:12px;padding:9px 12px;max-width:90%;font-size:12px;font-weight:850;white-space:nowrap;opacity:0;transition:opacity .18s;pointer-events:none;text-align:center}
#panelHost{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:13px;background:#07150d99}
.panel{width:min(650px,100%);max-height:94%;overflow:auto;touch-action:pan-y;background:linear-gradient(150deg,#315640f7,#13291ff8 70%);border:2px solid #e6ffd27c;border-radius:23px;padding:clamp(15px,4vw,25px);box-shadow:0 22px 60px #0009,inset 0 1px #fff4;text-align:center}
.logo{font-size:clamp(34px,8.5vw,67px);line-height:.92;font-weight:1000;letter-spacing:-2.5px;text-shadow:0 4px #1b3928,0 7px #09170e}.logo .gold{color:var(--gold)}.subtitle{font-size:14px;line-height:1.5;color:#d6ead5;max-width:490px;margin:13px auto 18px}
h2{font-size:clamp(24px,5.5vw,34px);line-height:1.1;margin:0 0 8px;font-weight:1000}.muted{color:#c5ddc9;font-size:13px;line-height:1.5}
.btnrow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.btn{background:linear-gradient(#a7f17d,#54ca3d);color:#15341a;border:2px solid #e1ffbf;border-radius:12px;padding:12px 15px;min-width:100px;font-weight:1000;box-shadow:0 4px 0 #2a722a}
.btn.gold{background:linear-gradient(#fff09b,#f4b432);border-color:#fff7c6;color:#55380a;box-shadow:0 4px 0 #9b5b13}.btn.blue{background:linear-gradient(#9ce3ff,#3999d5);border-color:#d7f6ff;color:#10354b;box-shadow:0 4px 0 #17527d}.btn.dark{background:linear-gradient(#6c8b77,#355541);border-color:#c2dfc6;color:#fff;box-shadow:0 4px 0 #183426}.btn:active{transform:translateY(3px);box-shadow:0 1px #183426}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{background:#10261bcf;border:1px solid #d7f4d22b;border-radius:13px;padding:11px 5px}.stat strong{display:block;color:var(--gold);font-size:clamp(18px,4vw,26px)}.stat small{font-size:11px;color:#c9e1c9;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:13px 0}.card{background:#10251bd6;border:1px solid #d7f4d233;border-radius:14px;padding:11px 8px;min-height:102px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.card .emoji{font-size:29px}.card strong{font-size:13px}.card small{font-size:11px;color:#c6dfc6;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#10271ec9;border:1px solid #ffffff25;border-radius:13px;padding:12px;margin:8px 0;text-align:left}.row .desc{font-size:12px;color:#c3dec6;margin-top:3px}
.tag{display:inline-block;background:#ffdc64;color:#49330c;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:1000}
#battleHUD{position:absolute;inset:0;pointer-events:none;display:none}.battleTop{position:absolute;top:58px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px}.battlePill{background:#14271fed;border:1px solid #fff7;border-radius:10px;padding:7px 9px;font-size:13px;font-weight:1000;text-shadow:0 2px #0008}
#deployHint{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);background:#14271fed;border:1px solid #fff7;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:900;white-space:nowrap}
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);z-index:20;background:#14271ff2;border:1px solid #eaffd477;border-radius:12px;padding:10px 15px;font-size:13px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
@media(max-height:520px){.panel{padding:12px;max-height:97%}.subtitle{margin:7px auto 10px}.stats{margin:8px 0}.cards{gap:6px;margin:8px 0}.card{min-height:70px;padding:6px}.card .emoji{font-size:23px}.navbtn{min-height:46px}.navbtn .ico{font-size:19px}.battleTop{top:48px}}
</style>
</head>
<body>
<div id="app"><canvas id="world"></canvas>
<div id="hud">
 <div class="top"><div class="resources">
  <div class="res">🪙 <b id="gold">1,200</b></div><div class="res">🧪 <b id="elixir">900</b></div><div class="res">💎 <b id="gems">25</b></div><div class="res">🏆 <b id="trophies">0</b></div>
 </div><div id="topright"><button class="iconbtn" id="questBtn">📜</button><button class="iconbtn" id="menuBtn">☰</button></div></div>
 <div id="bottom">
  <button class="navbtn" data-action="build"><span class="ico">🏗️</span>BUILD</button>
  <button class="navbtn" data-action="army"><span class="ico">⚔️</span>ARMY</button>
  <button class="navbtn" data-action="attack"><span class="ico">🛡️</span>ATTACK</button>
  <button class="navbtn" data-action="shop"><span class="ico">🛒</span>SHOP</button>
  <button class="navbtn" data-action="save"><span class="ico">💾</span>SAVE</button>
 </div>
</div>
<div id="battleHUD"><div class="battleTop"><div class="battlePill">⭐ <span id="stars">0</span>/3</div><div class="battlePill">⏱ <span id="timer">120</span>s</div><div class="battlePill">💥 <span id="percent">0</span>%</div></div><div id="deployHint">Tap inside enemy base to deploy troops</div></div>
<div id="context"></div><div id="toast"></div><div id="panelHost"></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),c=canvas.getContext('2d'),$=id=>document.getElementById(id),host=$('panelHost');
let W=innerWidth,H=innerHeight,D=1,mode='village',panelOpen=true,placing=null,selected=null,toastTimer,cam={x:0,y:0};
const defs={
 townhall:{name:'Town Hall',emoji:'🏰',cost:0,hp:1400,desc:'Your village heart. Protect it at all costs.',kind:'core'},
 goldmine:{name:'Gold Mine',emoji:'⛏️',cost:180,hp:340,desc:'Generates gold every few seconds.',kind:'resource'},
 elixir:{name:'Elixir Pump',emoji:'🧪',cost:180,hp:340,desc:'Generates elixir every few seconds.',kind:'resource'},
 cannon:{name:'Cannon',emoji:'💣',cost:300,hp:650,desc:'Automatically defends against raiders.',kind:'defense'},
 archer:{name:'Archer Tower',emoji:'🏹',cost:420,hp:520,desc:'Long-range village defense.',kind:'defense'},
 barracks:{name:'Barracks',emoji:'⚔️',cost:260,hp:430,desc:'Unlocks and trains warriors.',kind:'army'},
 camp:{name:'Army Camp',emoji:'⛺',cost:240,hp:400,desc:'Increases your troop capacity.',kind:'army'},
 wall:{name:'Wall',emoji:'🧱',cost:55,hp:280,desc:'Small, cheap defensive segment.',kind:'defense'},
 hut:{name:'Builder Hut',emoji:'🛖',cost:140,hp:330,desc:'A little home for a builder.',kind:'support'}
};
const initial=()=>[
{id:1,type:'townhall',x:.5,y:.49,level:1,hp:1400},
{id:2,type:'goldmine',x:.29,y:.34,level:1,hp:340},
{id:3,type:'elixir',x:.71,y:.34,level:1,hp:340},
{id:4,type:'cannon',x:.29,y:.65,level:1,hp:650},
{id:5,type:'barracks',x:.71,y:.65,level:1,hp:430},
{id:6,type:'hut',x:.5,y:.27,level:1,hp:330},
{id:7,type:'camp',x:.5,y:.75,level:1,hp:400}
];
let s={gold:1200,elixir:900,gems:25,trophies:0,wins:0,best:0,troops:8,capacity:20,buildings:initial(),tasks:{build:false,train:false,raid:false,collect:false},last:Date.now(),battle:null};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function round(x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function label(t,x,y,size,color='#fff',align='center'){c.fillStyle=color;c.font=`900 ${size}px system-ui`;c.textAlign=align;c.textBaseline='middle';c.fillText(t,x,y)}
function pos(b){return{x:b.x*W,y:b.y*H}}
function toast(t){let e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity=0,2100)}
function hud(){for(const k of ['gold','elixir','gems','trophies'])$(k).textContent=Math.floor(s[k]).toLocaleString('en-IN')}
function save(silent=false){try{localStorage.setItem('kcf-save-v2',JSON.stringify({...s,battle:null}));if(!silent)toast('Village saved on this device ✓')}catch(e){toast('Save unavailable in this browser')}}
function load(){try{let a=JSON.parse(localStorage.getItem('kcf-save-v2'));if(a&&Array.isArray(a.buildings)){s={...s,...a,battle:null};return true}}catch(e){}return false}
function ground(){
 let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b6e68a');g.addColorStop(.5,'#8bd16e');g.addColorStop(1,'#4e9a4e');c.fillStyle=g;c.fillRect(0,0,W,H);
 // rolling terrain
 for(let i=0;i<8;i++){c.beginPath();let y=H*(.08+i*.12);c.moveTo(0,y);for(let x=0;x<=W+20;x+=20)c.lineTo(x,y+Math.sin(x*.011+i*1.3)*9+Math.sin(x*.025+i)*4);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fillStyle=i%2?'#d9f5a61b':'#267a3a16';c.fill()}
 // stone footpath
 c.lineCap='round';c.strokeStyle='#d2bd8c';c.lineWidth=19;c.beginPath();c.moveTo(W*.5,H*.55);c.lineTo(W*.5,H*.92);c.stroke();c.strokeStyle='#ead9ab';c.lineWidth=12;c.stroke();
 for(let i=0;i<55;i++){let x=(i*157+27)%W,y=(i*89+41)%H;c.fillStyle=i%2?'#e9f9b866':'#2e783944';c.fillRect(x,y,3,2)}
 for(let i=0;i<7;i++){let x=(i*191+61)%W,y=H*(.2+(i%4)*.17);tree(x,y,.48+(i%3)*.13)}
}
function tree(x,y,k){c.fillStyle='#775034';c.fillRect(x-3*k,y,6*k,19*k);for(let j=0;j<3;j++){c.beginPath();c.moveTo(x,y-27*k+j*11*k);c.lineTo(x-17*k+j*2*k,y+3*k+j*5*k);c.lineTo(x+17*k-j*2*k,y+3*k+j*5*k);c.closePath();c.fillStyle=['#276b3d','#348449','#4b9a4c'][j];c.fill()}}
function building(b,enemy=false){
 let d=defs[b.type],p=pos(b),scale=Math.min(W,H)/430*(b.type==='townhall'?1.1:1),w=(b.type==='wall'?38:b.type==='townhall'?76:61)*scale,h=(b.type==='wall'?29:b.type==='townhall'?77:59)*scale;
 c.fillStyle='#19462d4a';c.beginPath();c.ellipse(p.x,p.y+h*.35,w*.72,h*.25,0,0,Math.PI*2);c.fill();
 if(b.type==='townhall'){round(p.x-w*.43,p.y-h*.38,w*.86,h*.72,7,'#97613a','#57361f');round(p.x-w*.3,p.y-h*.63,w*.6,h*.4,5,'#d19a55','#68452a');c.fillStyle='#b94135';c.beginPath();c.moveTo(p.x-w*.56,p.y-h*.48);c.lineTo(p.x,p.y-h*.84);c.lineTo(p.x+w*.56,p.y-h*.48);c.closePath();c.fill();c.strokeStyle='#70332b';c.stroke();round(p.x-w*.12,p.y-h*.1,w*.24,h*.4,3,'#4b3427','#d4a56c');round(p.x-w*.26,p.y-h*.31,w*.13,h*.13,2,'#81d7f4');round(p.x+w*.13,p.y-h*.31,w*.13,h*.13,2,'#81d7f4')}
 else if(b.type==='goldmine'||b.type==='elixir'){round(p.x-w*.47,p.y-h*.22,w*.94,h*.53,7,b.type==='goldmine'?'#846044':'#7d5894','#4e3929');c.fillStyle=b.type==='goldmine'?'#e1c06c':'#bb8be0';c.beginPath();c.moveTo(p.x-w*.58,p.y-h*.22);c.lineTo(p.x,p.y-h*.62);c.lineTo(p.x+w*.58,p.y-h*.22);c.closePath();c.fill();label(d.emoji,p.x,p.y,26*scale)}
 else if(b.type==='cannon'){round(p.x-w*.5,p.y-h*.22,w,h*.48,8,'#627985','#2e4852');c.fillStyle='#3c525e';c.beginPath();c.arc(p.x,p.y-h*.15,w*.28,0,Math.PI*2);c.fill();c.save();c.translate(p.x+4*scale,p.y-h*.2);c.rotate(-.4);round(-3*scale,-24*scale,9*scale,28*scale,3,'#334e58','#a7c0c6');c.restore();c.beginPath();c.arc(p.x,p.y-h*.15,7*scale,0,Math.PI*2);c.fillStyle='#b9c8c7';c.fill()}
 else if(b.type==='archer'){round(p.x-w*.43,p.y-h*.26,w*.86,h*.54,6,'#9a704a','#563b28');c.fillStyle='#875039';c.beginPath();c.moveTo(p.x-w*.55,p.y-h*.24);c.lineTo(p.x,p.y-h*.64);c.lineTo(p.x+w*.55,p.y-h*.24);c.closePath();c.fill();label('🏹',p.x,p.y,26*scale)}
 else if(b.type==='barracks'||b.type==='hut'||b.type==='camp'){round(p.x-w*.44,p.y-h*.24,w*.88,h*.55,6,b.type==='camp'?'#c0a36b':'#a97749','#553a29');c.fillStyle=b.type==='barracks'?'#b94c3c':'#7b4935';c.beginPath();c.moveTo(p.x-w*.57,p.y-h*.22);c.lineTo(p.x,p.y-h*.62);c.lineTo(p.x+w*.57,p.y-h*.22);c.closePath();c.fill();label(d.emoji,p.x,p.y,23*scale)}
 else if(b.type==='wall'){round(p.x-w*.5,p.y-h*.25,w,h*.5,3,'#aabbb0','#5a6c60');for(let j=-1;j<=1;j++)round(p.x+j*w*.28-w*.1,p.y-h*.17,w*.2,h*.14,2,'#d0dbd1','#687d6d')}
 round(p.x-13*scale,p.y+h*.42,26*scale,13*scale,4,'#183a29','#e4f5d1');label('Lv '+b.level,p.x,p.y+h*.42+6*scale,9*scale);
 if(selected===b.id){c.strokeStyle='#fff276';c.lineWidth=3;c.setLineDash([5,4]);c.beginPath();c.ellipse(p.x,p.y,w*.76,h*.68,0,0,Math.PI*2);c.stroke();c.setLineDash([])}
 if(enemy&&b.hp<b.max){c.fillStyle='#392526';c.fillRect(p.x-22,p.y-h*.8,44,5);c.fillStyle='#7aef54';c.fillRect(p.x-22,p.y-h*.8,44*Math.max(0,b.hp/b.max),5)}
}
function village(){ground();s.buildings.forEach(b=>building(b));for(let i=0;i<6;i++){let x=W*(.18+i*.13),y=H*(.82+Math.sin(Date.now()/800+i)*.009);c.fillStyle='#f3c6a0';c.beginPath();c.arc(x,y-7,4,0,7);c.fill();c.fillStyle=['#d95444','#479ee2','#e4bc43'][i%3];c.fillRect(x-4,y-4,8,9)}}
function battleDraw(){ground();c.fillStyle='#c6ad78';c.beginPath();c.ellipse(W*.5,H*.54,W*.41,H*.27,0,0,7);c.fill();c.fillStyle='#7fca60';c.beginPath();c.ellipse(W*.5,H*.51,W*.4,H*.26,0,0,7);c.fill();let b=s.battle;b.enemies.forEach(e=>building(e,true));b.units.forEach(u=>{c.fillStyle='#e8c4a0';c.beginPath();c.arc(u.x*W,u.y*H-5,7,0,7);c.fill();c.fillStyle='#3e75d0';c.fillRect(u.x*W-6,u.y*H,12,12);c.fillStyle='#ddd';c.fillRect(u.x*W+2,u.y*H-2,8,3)});c.strokeStyle='#ffffff9c';c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.ellipse(W*.5,H*.54,W*.43,H*.29,0,0,7);c.stroke();c.setLineDash([])}
function render(){c.clearRect(0,0,W,H);mode==='battle'?battleDraw():village();requestAnimationFrame(render)}requestAnimationFrame(render);
function panel(html){host.innerHTML=`<div class="panel">${html}</div>`;host.style.display='flex';panelOpen=true}
function close(){host.style.display='none';panelOpen=false}
function menu(){mode='village';$('battleHUD').style.display='none';$('bottom').style.display='flex';panel(`<div class="logo">KINGDOMS <span class="gold">& CLANS</span></div><div class="subtitle">Build a thriving village, command your warriors, defend your land, and raid rival kingdoms. Your frontier awaits.</div><div class="stats"><div class="stat"><strong>🏰 ${s.buildings.find(b=>b.type==='townhall')?.level||1}</strong><small>TOWN HALL</small></div><div class="stat"><strong>⚔️ ${s.troops}</strong><small>READY TROOPS</small></div><div class="stat"><strong>🏆 ${s.trophies}</strong><small>TROPHIES</small></div></div><div class="btnrow"><button class="btn" id="enter">ENTER VILLAGE</button><button class="btn gold" id="raid">⚔️ RAID ENEMY</button></div><div class="btnrow"><button class="btn dark" id="how">HOW TO PLAY</button><button class="btn dark" id="reset">RESET SAVE</button></div><p class="muted">Frontier Edition · Original strategy-game prototype · Progress saves in this browser.</p>`);$('enter').onclick=()=>close();$('raid').onclick=startBattle;$('how').onclick=help;$('reset').onclick=()=>panel(`<h2>Reset village?</h2><p class="muted">This removes your local save from this browser.</p><div class="btnrow"><button class="btn gold" id="yes">RESET</button><button class="btn dark" id="no">CANCEL</button></div>`);if($('yes'))$('yes').onclick=()=>{localStorage.removeItem('kcf-save-v2');s={gold:1200,elixir:900,gems:25,trophies:0,wins:0,best:0,troops:8,capacity:20,buildings:initial(),tasks:{build:false,train:false,raid:false,collect:false},last:Date.now(),battle:null};hud();menu()};if($('no'))$('no').onclick=menu}
function help(){panel(`<h2>Commander’s field guide</h2><div class="row"><div>🏗️ <b>Build</b><div class="desc">Pick a structure, then tap an open patch of land.</div></div></div><div class="row"><div>⬆️ <b>Upgrade</b><div class="desc">Tap any building in your village to improve its level and health.</div></div></div><div class="row"><div>⚔️ <b>Train troops</b><div class="desc">Spend elixir to train warriors. Army Camp levels increase capacity.</div></div></div><div class="row"><div>🛡️ <b>Raid</b><div class="desc">Tap inside the enemy base to deploy troops. They seek and attack buildings.</div></div></div><div class="btnrow"><button class="btn" id="got">LET’S GO</button></div>`);$('got').onclick=()=>close()}
function buildPanel(){let list=Object.keys(defs).filter(k=>k!=='townhall');panel(`<h2>Builder’s Workshop</h2><p class="muted">Choose a structure, then tap a clear spot in your village. Each structure has a purpose.</p><div class="cards">${list.map(k=>{let d=defs[k];return `<div class="card"><span class="emoji">${d.emoji}</span><strong>${d.name}</strong><small>${d.cost} gold</small><small>${d.desc}</small><button class="btn gold" data-place="${k}" style="padding:7px 9px;min-width:0;margin-top:5px">PLACE</button></div>`}).join('')}</div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);host.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{let type=b.dataset.place;if(s.gold<defs[type].cost){toast('Not enough gold');return}placing=type;close();toast(`Tap an empty spot to place ${defs[type].name}`)});$('back').onclick=close}
function upgrade(b){let d=defs[b.type],cost=Math.round((d.cost||200)*(.7+b.level*.72));panel(`<h2>${d.emoji} ${d.name}</h2><p class="muted">${d.desc}</p><div class="stats"><div class="stat"><strong>Level ${b.level}</strong><small>CURRENT LEVEL</small></div><div class="stat"><strong>${b.hp}</strong><small>HIT POINTS</small></div><div class="stat"><strong>${cost}</strong><small>UPGRADE COST</small></div></div><div class="btnrow"><button class="btn gold" id="up">UPGRADE · ${cost} 🪙</button><button class="btn blue" id="move">MOVE</button><button class="btn dark" id="done">CLOSE</button></div>`);$('up').onclick=()=>{if(s.gold<cost){toast('Not enough gold');return}s.gold-=cost;b.level++;b.hp=Math.round(b.hp*1.28);if(b.type==='camp')s.capacity=Math.min(60,s.capacity+3);s.tasks.build=true;hud();save(true);toast('Upgrade complete!');upgrade(b)};$('move').onclick=()=>{placing='move:'+b.id;selected=null;close();toast('Tap a new location for this building')};$('done').onclick=()=>{selected=null;close()}}
function armyPanel(){panel(`<h2>Army Training Grounds</h2><p class="muted">Every raid begins with a trained army. Train warriors using elixir.</p><div class="stats"><div class="stat"><strong>🪖 ${s.troops}</strong><small>READY TROOPS</small></div><div class="stat"><strong>🧪 ${Math.floor(s.elixir)}</strong><small>ELIXIR</small></div><div class="stat"><strong>${s.capacity}</strong><small>ARMY CAPACITY</small></div></div><div class="row"><div><b>🪖 Frontier Warrior</b><div class="desc">Balanced melee unit · 80 elixir each</div></div><span class="tag">COMMON</span></div><div class="btnrow"><button class="btn" id="one">TRAIN 1 · 80 🧪</button><button class="btn gold" id="five">TRAIN 5 · 400 🧪</button></div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);$('one').onclick=()=>train(1);$('five').onclick=()=>train(5);$('back').onclick=close}
function train(n){let room=s.capacity-s.troops;n=Math.min(n,room);if(n<=0){toast('Army camp full! Upgrade or build a camp.');return}if(s.elixir<80*n){toast('Not enough elixir!');return}s.elixir-=80*n;s.troops+=n;s.tasks.train=true;hud();toast(`${n} warrior${n>1?'s':''} ready for battle!`);armyPanel()}
function shop(){panel(`<h2>Kingdom Store</h2><p class="muted">Earn resources from mines and raids. Premium currency is decorative in this prototype.</p><div class="cards"><div class="card"><span class="emoji">🪙</span><strong>Gold Cache</strong><small>+500 gold</small><button class="btn gold" data-buy="gold">CLAIM</button></div><div class="card"><span class="emoji">🧪</span><strong>Elixir Flask</strong><small>+400 elixir</small><button class="btn gold" data-buy="elixir">CLAIM</button></div><div class="card"><span class="emoji">💎</span><strong>Gem Pouch</strong><small>Cosmetic only</small><button class="btn dark" data-buy="gems">VIEW</button></div></div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);host.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let k=b.dataset.buy;if(k==='gold'){s.gold+=500;toast('+500 gold claimed')}else if(k==='elixir'){s.elixir+=400;toast('+400 elixir claimed')}else toast('Gems are cosmetic in this offline version');hud();save(true)});$('back').onclick=close}
function quests(){panel(`<h2>Commander’s Orders</h2><p class="muted">Finish objectives to claim a little extra loot.</p><div class="row"><div><b>🏗️ Builder’s first job</b><div class="desc">Build or upgrade a structure</div></div><b>${s.tasks.build?'✅':'⬜'}</b></div><div class="row"><div><b>⚔️ Ready for battle</b><div class="desc">Train at least one troop</div></div><b>${s.tasks.train?'✅':'⬜'}</b></div><div class="row"><div><b>🛡️ First raid</b><div class="desc">Launch an attack</div></div><b>${s.tasks.raid?'✅':'⬜'}</b></div><div class="row"><div><b>🎁 Reward</b><div class="desc">Claim once all three are complete</div></div><button class="btn gold" id="claim" style="min-width:80px;padding:8px">CLAIM</button></div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);$('claim').onclick=()=>{if(s.tasks.build&&s.tasks.train&&s.tasks.raid){s.gold+=500;s.elixir+=300;s.gems+=5;s.tasks={build:false,train:false,raid:false,collect:true};hud();save(true);toast('Quest reward claimed! +500 gold, +300 elixir, +5 gems');quests()}else toast('Complete all three orders first')};$('back').onclick=close}
function startBattle(){if(s.troops<1){toast('Train warriors before attacking');armyPanel();return}mode='battle';placing=null;selected=null;s.battle={time:120,started:Date.now(),units:[],deployed:0,enemies:[{id:201,type:'townhall',x:.5,y:.43,level:2,hp:1400,max:1400},{id:202,type:'cannon',x:.31,y:.44,level:1,hp:650,max:650},{id:203,type:'archer',x:.69,y:.44,level:1,hp:520,max:520},{id:204,type:'goldmine',x:.37,y:.64,level:1,hp:340,max:340},{id:205,type:'elixir',x:.63,y:.64,level:1,hp:340,max:340},{id:206,type:'barracks',x:.5,y:.68,level:1,hp:430,max:430}]};$('battleHUD').style.display='block';$('bottom').style.display='none';$('menuBtn').textContent='✕';close();$('deployHint').textContent=`Tap enemy base to deploy · ${s.troops} troops`;toast('Raid started! Tap inside the enemy base to deploy')}
function finishBattle(){let b=s.battle;if(!b||b.done)return;b.done=true;let destroyed=b.enemies.filter(e=>e.hp<=0).length,pct=Math.round(destroyed/b.enemies.length*100),stars=(pct>=50?1:0)+(pct>=80?1:0)+(b.enemies[0].hp<=0?1:0),lootG=160+Math.round(pct*3),lootE=100+Math.round(pct*2);s.trophies+=stars*6;s.gold+=lootG;s.elixir+=lootE;s.wins+=stars?1:0;s.best=Math.max(s.best,pct);s.troops=Math.max(0,s.troops-b.deployed);s.tasks.raid=true;s.battle=null;mode='village';$('battleHUD').style.display='none';$('bottom').style.display='flex';$('menuBtn').textContent='☰';hud();save(true);panel(`<h2>${stars?'🏆 RAID VICTORY':'🛡️ RAID REPORT'}</h2><p class="muted">Your warriors return from the frontier. Spend the loot to strengthen your kingdom.</p><div class="stats"><div class="stat"><strong>${stars}/3 ⭐</strong><small>STARS</small></div><div class="stat"><strong>${pct}%</strong><small>DESTRUCTION</small></div><div class="stat"><strong>+${lootG} 🪙</strong><small>GOLD LOOT</small></div></div><div class="row"><span>🧪 Elixir looted</span><b>+${lootE}</b></div><div class="row"><span>🏆 Trophies earned</span><b>+${stars*6}</b></div><div class="btnrow"><button class="btn" id="again">NEXT RAID</button><button class="btn gold" id="home">RETURN HOME</button></div>`);$('again').onclick=startBattle;$('home').onclick=()=>close()}
function battleTick(dt){let b=s.battle;if(!b)return;b.time=Math.max(0,120-(Date.now()-b.started)/1000);$('timer').textContent=Math.ceil(b.time);let n=b.enemies.filter(e=>e.hp<=0).length,p=Math.round(n/b.enemies.length*100),st=(p>=50?1:0)+(p>=80?1:0)+(b.enemies[0].hp<=0?1:0);$('percent').textContent=p;$('stars').textContent=st;
 b.units.forEach(u=>{if(u.hp<=0)return;let targets=b.enemies.filter(e=>e.hp>0);if(!targets.length){u.hp=0;return}targets.sort((a,z)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(z.x-u.x,z.y-u.y));let t=targets[0],dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);if(d>.055){u.x+=dx/d*dt*.055;u.y+=dy/d*dt*.055}else{t.hp=Math.max(0,t.hp-dt*52)}if(Math.random()<dt*.10)u.hp-=.12});
 b.units=b.units.filter(u=>u.hp>0);if(b.time<=0||b.enemies.every(e=>e.hp<=0)||(b.deployed>0&&b.units.length===0))finishBattle()}
let last=performance.now();function tick(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(mode==='battle')battleTick(dt);else{let elapsed=(Date.now()-s.last)/1000;if(elapsed>=3){s.gold+=s.buildings.filter(b=>b.type==='goldmine').reduce((n,b)=>n+1.8*b.level,0);s.elixir+=s.buildings.filter(b=>b.type==='elixir').reduce((n,b)=>n+1.5*b.level,0);s.last=Date.now();hud()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
function xy(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(panelOpen)return;let p=xy(e);if(mode==='battle'){let b=s.battle;if(b&&p.x>W*.06&&p.x<W*.94&&p.y>H*.24&&p.y<H*.82&&b.deployed<s.troops){b.units.push({x:p.x/W,y:p.y/H,hp:5});b.deployed++;$('deployHint').textContent=`Troops deployed ${b.deployed}/${s.troops}`;if(b.deployed>=s.troops)$('deployHint').textContent='All troops deployed!'}return}
 if(placing){if(placing.startsWith('move:')){let id=+placing.split(':')[1],b=s.buildings.find(q=>q.id===id);if(b){b.x=p.x/W;b.y=p.y/H;toast('Building moved');save(true)}placing=null;return}let type=placing,d=defs[type];if(s.gold<d.cost){toast('Not enough gold');placing=null;return}if(p.y<H*.18||p.y>H*.88||s.buildings.some(b=>Math.hypot(b.x*W-p.x,b.y*H-p.y)<Math.min(W,H)*.105)){toast('Choose a clear patch inside the village');return}s.gold-=d.cost;s.buildings.push({id:Date.now(),type,x:p.x/W,y:p.y/H,level:1,hp:d.hp});s.tasks.build=true;placing=null;hud();toast(d.name+' placed!');save(true);return}
 let b0=null,dist=Infinity;s.buildings.forEach(b=>{let q=pos(b),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<Math.min(W,H)*.09&&d<dist){dist=d;b0=b}});if(b0){selected=b0.id;upgrade(b0)}else selected=null;
});
$('menuBtn').onclick=()=>{if(mode==='battle'){if(confirm('Abandon this raid?')){s.battle=null;mode='village';$('battleHUD').style.display='none';$('bottom').style.display='flex';$('menuBtn').textContent='☰';menu()}}else menu()};
$('questBtn').onclick=()=>{if(!panelOpen)quests()};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(panelOpen)return;let a=b.dataset.action;if(a==='build')buildPanel();if(a==='army')armyPanel();if(a==='attack')startBattle();if(a==='shop')shop();if(a==='save')save()});
hud();if(!load())s.buildings=initial();hud();menu();
})();
</script>
</body></html>
