<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172a24">
<title>Kingdoms & Clans</title>
<style>
:root{--gold:#ffd45b;--green:#76e35b;--dark:#15251f;--panel:#203a30;--line:#ffffff32;--text:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d19;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#8ecf73}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:max(7px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;align-items:flex-start;pointer-events:none}
.resourcebar{display:flex;gap:5px;flex-wrap:wrap}.resource{background:#172b25ed;border:2px solid #d6f2ca66;border-radius:12px;padding:6px 9px;box-shadow:0 3px 0 #07140f70;font-weight:950;font-size:clamp(11px,2.7vw,15px);white-space:nowrap;text-shadow:0 2px #0007}.resource span{color:var(--gold)}
.topbtn{pointer-events:auto;border:2px solid #e4f6d5a8;background:linear-gradient(#4a6a58,#20392d);border-radius:12px;padding:8px 10px;font-weight:900;box-shadow:0 3px 0 #0e2119}
#bottom{position:absolute;left:0;right:0;bottom:max(5px,env(safe-area-inset-bottom));padding:7px 8px 9px;display:flex;gap:7px;align-items:stretch;justify-content:center;pointer-events:none}
.action{pointer-events:auto;flex:1;max-width:145px;min-width:0;min-height:58px;border-radius:13px;background:linear-gradient(#567f60,#244b35);border:2px solid #c6edb1;box-shadow:0 4px 0 #102c1d;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(10px,2.5vw,13px);font-weight:950;text-shadow:0 2px #0008}
.action .ico{font-size:23px;line-height:1.1}.action:active,.action.selected{transform:translateY(3px);box-shadow:0 1px 0 #102c1d;filter:brightness(1.15)}
#hint{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#15281fe8;border:1px solid #ffffff5c;border-radius:12px;padding:9px 13px;font-size:12px;font-weight:800;text-align:center;max-width:90%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6}
#panelWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:15px;background:#0816108a;z-index:10}
.panel{width:min(620px,100%);max-height:94%;overflow:auto;background:linear-gradient(160deg,#315544,#172e26);border:2px solid #e2f7d57a;border-radius:22px;padding:clamp(15px,4vw,25px);box-shadow:0 18px 55px #0008,inset 0 1px #fff4;text-align:center;touch-action:pan-y}
.logo{font-size:clamp(33px,8vw,61px);font-weight:1000;letter-spacing:-2px;line-height:.95;text-shadow:0 4px #142d21,0 7px #09170f}.logo span{color:#ffdc63}.sub{color:#d3e9d3;font-size:14px;line-height:1.5;margin:12px auto 18px;max-width:480px}
.btnrow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}
.btn{border-radius:12px;padding:12px 16px;background:linear-gradient(#a6f37a,#51c83e);color:#15351d;border:2px solid #d9ffb7;box-shadow:0 4px 0 #2a722a;font-weight:1000;min-width:105px}
.btn.gold{background:linear-gradient(#ffea8a,#f5ad30);border-color:#fff2b6;color:#543a0c;box-shadow:0 4px 0 #9b5d17}
.btn.blue{background:linear-gradient(#91dcff,#389bdb);border-color:#c8f0ff;color:#0c2d44;box-shadow:0 4px 0 #17527d}
.btn.dark{background:linear-gradient(#6e8c7b,#365444);border-color:#b4d5bc;color:white;box-shadow:0 4px 0 #183426}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #183426}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:14px 0}
.card{background:#10261dc9;border:1px solid #d9f1d52b;border-radius:14px;padding:12px 9px;min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.card .emoji{font-size:30px}.card strong{font-size:13px}.card small{font-size:11px;color:#c2ddc2}
.title{font-size:clamp(23px,5vw,32px);font-weight:1000;margin:0 0 6px}.muted{color:#c5dfc8;font-size:13px;line-height:1.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#10271dbd;border:1px solid #ffffff24;border-radius:13px;padding:12px;margin:8px 0;text-align:left}
#battleHud{position:absolute;inset:0;pointer-events:none;display:none}
#battleTop{position:absolute;top:62px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-weight:1000;text-shadow:0 2px #000}
.battlepill{background:#172a23e8;border:1px solid #fff5;border-radius:10px;padding:8px 10px}
#deploy{position:absolute;left:50%;bottom:95px;transform:translateX(-50%);background:#162c22e8;border:2px solid #d6f5c5;border-radius:13px;padding:8px 13px;font-weight:900;white-space:nowrap;pointer-events:none}
#rotate{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:#fff9;font-size:10px;pointer-events:none}
@media(max-height:520px){.panel{padding:12px;max-height:97%}.sub{margin:7px auto 10px}.grid{margin:8px 0;gap:6px}.card{min-height:70px;padding:7px}.card .emoji{font-size:24px}.action{min-height:48px}.action .ico{font-size:20px}#battleTop{top:48px}}
</style>
</head>
<body>
<div id="game">
<canvas id="cv"></canvas>
<div id="top">
 <div class="resourcebar">
  <div class="resource">🪙 <span id="gold">850</span></div>
  <div class="resource">💧 <span id="elixir">650</span></div>
  <div class="resource">🏆 <span id="trophies">0</span></div>
 </div>
 <button class="topbtn" id="menuBtn">☰</button>
</div>
<div id="battleHud">
 <div id="battleTop"><div class="battlepill">⭐ <span id="stars">0</span>/3</div><div class="battlepill">⏱ <span id="timer">90</span>s</div><div class="battlepill">💥 <span id="percent">0</span>%</div></div>
 <div id="deploy">Tap the battlefield to deploy troops</div>
</div>
<div id="hint"></div>
<div id="bottom">
 <button class="action" data-action="shop"><span class="ico">🏗️</span>BUILD</button>
 <button class="action" data-action="army"><span class="ico">⚔️</span>ARMY</button>
 <button class="action" data-action="attack"><span class="ico">🛡️</span>ATTACK</button>
 <button class="action" data-action="tasks"><span class="ico">📜</span>TASKS</button>
 <button class="action" data-action="save"><span class="ico">💾</span>SAVE</button>
</div>
<div id="panelWrap"></div>
<div id="rotate">Tip: drag buildings to move them. Pinch/zoom is not required.</div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('panelWrap');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,mode='village',panelOpen=true,selectedBuild=null,drag=null,toastTimer=null;
const state={gold:850,elixir:650,trophies:0,buildings:[],troops:6,training:0, wins:0, best:0, sound:true, lastTick:Date.now(), battle:null, tasks:{build:false,train:false,attack:false}};
const buildingDefs={
 townhall:{name:'Town Hall',emoji:'🏰',cost:0,hp:1000,w:1.5,desc:'The heart of your village.'},
 goldmine:{name:'Gold Mine',emoji:'⛏️',cost:150,hp:260,w:1,desc:'Produces gold over time.'},
 elixir:{name:'Elixir Pump',emoji:'🧪',cost:150,hp:260,w:1,desc:'Produces elixir over time.'},
 cannon:{name:'Cannon',emoji:'💣',cost:250,hp:500,w:1,desc:'Defends your village in raids.'},
 barracks:{name:'Barracks',emoji:'⚔️',cost:220,hp:360,w:1,desc:'Train troops for attacks.'},
 wall:{name:'Wall',emoji:'🧱',cost:40,hp:220,w:.7,desc:'A small piece of protection.'},
 hut:{name:'Builder Hut',emoji:'🛖',cost:120,hp:280,w:1,desc:'A cozy hut for your builders.'}
};
function initBuildings(){return [
{id:1,type:'townhall',x:.5,y:.47,level:1,hp:1000},
{id:2,type:'goldmine',x:.27,y:.34,level:1,hp:260},
{id:3,type:'elixir',x:.72,y:.34,level:1,hp:260},
{id:4,type:'cannon',x:.29,y:.63,level:1,hp:500},
{id:5,type:'barracks',x:.71,y:.63,level:1,hp:360},
{id:6,type:'hut',x:.5,y:.25,level:1,hp:280}
]}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function text(s,x,y,size,color='#fff',align='center'){ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function world(){return {x:0,y:0,w:W,h:H}}
function rnd(n){return Math.sin(n*127.1+311.7)*43758.5453%1}
function drawGround(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a5df79');g.addColorStop(1,'#4e9b4e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // soft terrain bands
 for(let i=0;i<7;i++){ctx.beginPath();let y=H*(.12+i*.12);ctx.moveTo(0,y);for(let x=0;x<=W+30;x+=30)ctx.lineTo(x,y+Math.sin(x*.012+i*1.8)*10+Math.sin(x*.026+i)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=i%2?'#6fbd5d22':'#d5f5a522';ctx.fill()}
 // grass specks
 for(let i=0;i<65;i++){let x=(i*173+35)%W,y=(i*97+60)%(H);ctx.fillStyle=i%2?'#e1f6a477':'#2f793e55';ctx.fillRect(x,y,3,2)}
}
function drawTree(x,y,s=1){ctx.fillStyle='#6b4428';ctx.fillRect(x-3*s,y,6*s,20*s);for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(x,y-30*s+j*13*s);ctx.lineTo(x-19*s+j*2*s,y+4*s+j*6*s);ctx.lineTo(x+19*s-j*2*s,y+4*s+j*6*s);ctx.closePath();ctx.fillStyle=['#22613c','#2e7842','#3c914a'][j];ctx.fill()}}
function bpos(b){return {x:b.x*W,y:b.y*H}}
function drawBuilding(b){
 const d=buildingDefs[b.type],p=bpos(b),s=Math.min(W,H)/420*(b.type==='townhall'?1.13:1);
 const bw=(b.type==='townhall'?75:b.type==='wall'?34:58)*s,bh=(b.type==='townhall'?75:b.type==='wall'?28:58)*s;
 // shadow and plot
 ctx.fillStyle='#17442b45';ctx.beginPath();ctx.ellipse(p.x,p.y+bh*.38,bw*.7,bh*.25,0,0,Math.PI*2);ctx.fill();
 if(b.type==='townhall'){
  rr(p.x-bw*.45,p.y-bh*.4,bw*.9,bh*.75,8,'#8b5b37','#57351f');
  rr(p.x-bw*.32,p.y-bh*.62,bw*.64,bh*.45,6,'#c28b4d','#603d26');
  ctx.fillStyle='#b93f36';ctx.beginPath();ctx.moveTo(p.x-bw*.55,p.y-bh*.48);ctx.lineTo(p.x,p.y-bh*.83);ctx.lineTo(p.x+bw*.55,p.y-bh*.48);ctx.closePath();ctx.fill();ctx.strokeStyle='#5e2a26';ctx.lineWidth=3;ctx.stroke();
  rr(p.x-bw*.12,p.y-bh*.1,bw*.24,bh*.4,3,'#4d3429','#d5a66b');
  for(let j=-1;j<=1;j++)rr(p.x+j*bw*.22-bw*.06,p.y-bh*.31,bw*.12,bh*.14,2,'#75c8e5','#fff4');
 }else if(b.type==='goldmine'){
  rr(p.x-bw*.48,p.y-bh*.25,bw*.96,bh*.55,7,'#765239','#493a2b');ctx.fillStyle='#d9b96a';ctx.beginPath();ctx.moveTo(p.x-bw*.58,p.y-bh*.25);ctx.lineTo(p.x,p.y-bh*.62);ctx.lineTo(p.x+bw*.58,p.y-bh*.25);ctx.closePath();ctx.fill();ctx.strokeStyle='#8e6c39';ctx.stroke();text('⛏️',p.x,p.y,27*s);
 }else if(b.type==='elixir'){
  rr(p.x-bw*.45,p.y-bh*.25,bw*.9,bh*.55,8,'#8d6a48','#503c2a');ctx.fillStyle='#7c4d9d';ctx.beginPath();ctx.moveTo(p.x-bw*.57,p.y-bh*.25);ctx.lineTo(p.x,p.y-bh*.6);ctx.lineTo(p.x+bw*.57,p.y-bh*.25);ctx.closePath();ctx.fill();text('🧪',p.x,p.y,26*s);
 }else if(b.type==='cannon'){
  rr(p.x-bw*.5,p.y-bh*.25,bw,bh*.5,9,'#647783','#2d444a');ctx.fillStyle='#3b505c';ctx.beginPath();ctx.arc(p.x,p.y-bh*.13,bw*.27,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(p.x+4*s,p.y-bh*.19);ctx.rotate(-.35);rr(-3*s,-25*s,9*s,30*s,3,'#2f4852','#9ab0b7');ctx.restore();ctx.fillStyle='#95a9ae';ctx.beginPath();ctx.arc(p.x,p.y-bh*.13,7*s,0,Math.PI*2);ctx.fill();
 }else if(b.type==='barracks'){
  rr(p.x-bw*.48,p.y-bh*.3,bw*.96,bh*.6,6,'#9b6c44','#513a29');ctx.fillStyle='#bc4d3d';ctx.beginPath();ctx.moveTo(p.x-bw*.6,p.y-bh*.27);ctx.lineTo(p.x,p.y-bh*.62);ctx.lineTo(p.x+bw*.6,p.y-bh*.27);ctx.closePath();ctx.fill();rr(p.x-bw*.11,p.y-bh*.12,bw*.22,bh*.42,3,'#51372b');text('⚔️',p.x+bw*.25,p.y,15*s);
 }else if(b.type==='wall'){
  rr(p.x-bw*.5,p.y-bh*.25,bw,bh*.5,3,'#9da9a0','#4d5e55');for(let j=-1;j<=1;j++)rr(p.x+j*bw*.28-bw*.1,p.y-bh*.16,bw*.2,bh*.14,2,'#bdc9c0','#64766a');
 }else{
  rr(p.x-bw*.45,p.y-bh*.24,bw*.9,bh*.55,5,'#bd915a','#69472e');ctx.fillStyle='#7e4337';ctx.beginPath();ctx.moveTo(p.x-bw*.58,p.y-bh*.22);ctx.lineTo(p.x,p.y-bh*.63);ctx.lineTo(p.x+bw*.58,p.y-bh*.22);ctx.closePath();ctx.fill();rr(p.x-bw*.11,p.y-bh*.05,bw*.22,bh*.36,2,'#4b3427');
 }
 // level badge
 rr(p.x-13*s,p.y+bh*.42,26*s,13*s,5,'#173527','#e5f4d2');text('Lv '+b.level,p.x,p.y+bh*.42+6*s,9*s,'#fff');
 if(selectedBuild===b.id){ctx.strokeStyle='#fff46a';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();ctx.ellipse(p.x,p.y,bw*.75,bh*.65,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
}
function drawVillage(){
 drawGround();drawTree(W*.08,H*.31,.85);drawTree(W*.9,H*.36,1);drawTree(W*.12,H*.72,.65);drawTree(W*.88,H*.73,.7);
 // paths
 ctx.strokeStyle='#b9a477';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(W*.5,H*.54);ctx.lineTo(W*.5,H*.9);ctx.stroke();ctx.strokeStyle='#d8c99d';ctx.lineWidth=9;ctx.stroke();
 state.buildings.forEach(drawBuilding);
 // tiny villagers wandering decorations
 for(let i=0;i<5;i++){let x=W*(.18+i*.15),y=H*(.82+Math.sin(Date.now()/900+i)*.012);ctx.fillStyle='#f4c59b';ctx.beginPath();ctx.arc(x,y-8,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=['#e04e42','#4d9de0','#e5bd45'][i%3];ctx.fillRect(x-4,y-4,8,10)}
}
function drawBattle(){
 const b=state.battle;drawGround();
 // enemy island / enemy base ground
 ctx.fillStyle='#b9a77a';ctx.beginPath();ctx.ellipse(W*.5,H*.55,W*.39,H*.24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#82c866';ctx.beginPath();ctx.ellipse(W*.5,H*.52,W*.39,H*.24,0,0,Math.PI*2);ctx.fill();
 const enemy=[
 {x:.5,y:.45,type:'townhall',hp:1000,max:1000},
 {x:.33,y:.45,type:'cannon',hp:500,max:500},
 {x:.67,y:.45,type:'cannon',hp:500,max:500},
 {x:.5,y:.66,type:'goldmine',hp:260,max:260},
 {x:.34,y:.64,type:'elixir',hp:260,max:260}
 ];
 b.enemies.forEach(e=>{let p={x:e.x*W,y:e.y*H};const d=buildingDefs[e.type];drawBuilding({...e,id:1000+enemy.indexOf(e),level:1});if(e.hp<e.max){ctx.fillStyle='#3b2525';ctx.fillRect(p.x-22,p.y-39,44,5);ctx.fillStyle='#65ed56';ctx.fillRect(p.x-22,p.y-39,44*Math.max(0,e.hp/e.max),5)}});
 b.units.forEach(u=>{ctx.fillStyle='#d8b18a';ctx.beginPath();ctx.arc(u.x*W,u.y*H-5,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4776d1';ctx.fillRect(u.x*W-6,u.y*H,12,12);ctx.fillStyle='#d8dbe1';ctx.fillRect(u.x*W+3,u.y*H-2,8,3)});
 // deployment boundary
 ctx.strokeStyle='#fff9';ctx.setLineDash([6,5]);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W*.5,H*.55,W*.43,H*.28,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
}
function render(){ctx.clearRect(0,0,W,H);if(mode==='battle')drawBattle();else drawVillage();requestAnimationFrame(render)}
requestAnimationFrame(render);
function updateHud(){$('gold').textContent=Math.floor(state.gold).toLocaleString('en-IN');$('elixir').textContent=Math.floor(state.elixir).toLocaleString('en-IN');$('trophies').textContent=state.trophies}
function toast(msg){const h=$('hint');h.textContent=msg;h.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>h.style.opacity=0,2200)}
function save(){try{localStorage.setItem('kingdomsAndClansSave',JSON.stringify({...state,battle:null}));toast('Village saved on this device!')}catch(e){toast('Could not save in this browser.')}}
function load(){try{const s=JSON.parse(localStorage.getItem('kingdomsAndClansSave')||'null');if(s){Object.assign(state,s);state.battle=null;mode='village';panelOpen=true;updateHud();return true}}catch(e){}return false}
function showPanel(html){wrap.innerHTML=`<div class="panel">${html}</div>`;wrap.style.display='flex';panelOpen=true}
function closePanel(){wrap.style.display='none';panelOpen=false}
function menu(){mode='village';showPanel(`<div class="logo">KINGDOMS <span>& CLANS</span></div><div class="sub">Build your village. Train your army. Raid enemy bases. Grow your clan kingdom.</div><div class="stats"><div class="card"><span class="emoji">🏰</span><strong>Town Hall 1</strong><small>Village core</small></div><div class="card"><span class="emoji">⚔️</span><strong>${state.troops} troops</strong><small>Ready to deploy</small></div><div class="card"><span class="emoji">🏆</span><strong>${state.trophies}</strong><small>Trophies</small></div></div><div class="btnrow"><button class="btn" id="resume">ENTER VILLAGE</button><button class="btn gold" id="startAttack">⚔️ FIND A MATCH</button></div><div class="btnrow"><button class="btn dark" id="help">HOW TO PLAY</button><button class="btn dark" id="wipe">NEW SAVE</button></div><p class="muted">A fan-made, original browser strategy game prototype. Progress saves locally on this device.</p>`);
$('resume').onclick=()=>{closePanel();mode='village'};$('startAttack').onclick=startBattle;$('help').onclick=helpPanel;$('wipe').onclick=()=>showPanel(`<h2 class="title">Start a new village?</h2><p class="muted">This deletes your saved progress from this browser.</p><div class="btnrow"><button class="btn gold" id="yesWipe">RESET VILLAGE</button><button class="btn dark" id="noWipe">CANCEL</button></div>`);if($('yesWipe'))$('yesWipe').onclick=()=>{localStorage.removeItem('kingdomsAndClansSave');Object.assign(state,{gold:850,elixir:650,trophies:0,buildings:initBuildings(),troops:6,training:0,wins:0,best:0,tasks:{build:false,train:false,attack:false}});updateHud();menu()};if($('noWipe'))$('noWipe').onclick=menu;}
function helpPanel(){showPanel(`<h2 class="title">How to play</h2><div class="row"><span>🏗️ Build</span><small>Buy a building, then tap an empty spot.</small></div><div class="row"><span>⚔️ Army</span><small>Spend elixir to train troops.</small></div><div class="row"><span>🛡️ Attack</span><small>Tap inside the enemy base to deploy troops. Troops automatically attack buildings.</small></div><div class="row"><span>💾 Save</span><small>Save your village on this device.</small></div><div class="btnrow"><button class="btn" id="back">GOT IT</button></div>`);$('back').onclick=menu}
function shopPanel(){let cards=Object.keys(buildingDefs).filter(k=>k!=='townhall').map(k=>{let d=buildingDefs[k];return `<div class="card"><span class="emoji">${d.emoji}</span><strong>${d.name}</strong><small>${d.cost} gold · ${d.desc}</small><button class="btn gold" style="margin-top:7px;padding:8px 10px;min-width:0" data-build="${k}">PLACE</button></div>`}).join('');showPanel(`<h2 class="title">Village Shop</h2><p class="muted">Choose a building, then tap a clear spot on your village to place it.</p><div class="grid">${cards}</div><div class="btnrow"><button class="btn dark" id="back">BACK TO VILLAGE</button></div>`);wrap.querySelectorAll('[data-build]').forEach(btn=>btn.onclick=()=>{const type=btn.dataset.build,d=buildingDefs[type];if(state.gold<d.cost){toast('Not enough gold!');return}selectedBuild=type;closePanel();toast('Tap an empty place to build '+d.name)});$('back').onclick=()=>{selectedBuild=null;closePanel()}}
function armyPanel(){showPanel(`<h2 class="title">Army Camp</h2><p class="muted">Your army is trained with elixir. Troops deploy during attacks.</p><div class="stats"><div class="card"><span class="emoji">🛡️</span><strong>${state.troops}</strong><small>Ready troops</small></div><div class="card"><span class="emoji">🧪</span><strong>${state.elixir}</strong><small>Elixir</small></div><div class="card"><span class="emoji">⚔️</span><strong>${state.training}</strong><small>Training queue</small></div></div><div class="row"><div><b>Warrior</b><div class="muted">A sturdy all-round troop. Cost: 80 elixir</div></div><span style="font-size:30px">🪖</span></div><div class="btnrow"><button class="btn" id="train">TRAIN 1 TROOP · 80 🧪</button><button class="btn gold" id="train5">TRAIN 5 · 400 🧪</button></div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);$('train').onclick=()=>train(1);$('train5').onclick=()=>train(5);$('back').onclick=()=>{closePanel()}}
function train(n){let cost=80*n;if(state.elixir<cost){toast('Not enough elixir!');return}state.elixir-=cost;state.troops+=n;state.training+=n;state.tasks.train=true;updateHud();toast(`${n} warrior${n>1?'s':''} trained!`);armyPanel()}
function upgradePanel(b){let d=buildingDefs[b.type],cost=Math.round(d.cost*.8*b.level+100);showPanel(`<h2 class="title">${d.emoji} ${d.name}</h2><p class="muted">${d.desc}</p><div class="stats"><div class="card"><strong>Level ${b.level}</strong><small>Current level</small></div><div class="card"><strong>${b.hp}</strong><small>Hit points</small></div><div class="card"><strong>${cost}</strong><small>Upgrade cost</small></div></div><div class="btnrow"><button class="btn gold" id="upgrade">UPGRADE · ${cost} 🪙</button><button class="btn dark" id="move">MOVE BUILDING</button><button class="btn dark" id="close">CLOSE</button></div>`);$('upgrade').onclick=()=>{if(state.gold<cost){toast('Not enough gold!');return}state.gold-=cost;b.level++;b.hp=Math.round(b.hp*1.25);state.tasks.build=true;updateHud();toast(`${d.name} upgraded!`);upgradePanel(b)};$('move').onclick=()=>{selectedBuild='move:'+b.id;closePanel();toast('Tap a new spot to move building')};$('close').onclick=()=>{selectedBuild=null;closePanel()}}
function startBattle(){if(state.troops<=0){toast('Train some troops first!');armyPanel();return}mode='battle';state.battle={time:90,units:[],enemies:[
{x:.5,y:.45,type:'townhall',hp:1000,max:1000},
{x:.33,y:.45,type:'cannon',hp:500,max:500},
{x:.67,y:.45,type:'cannon',hp:500,max:500},
{x:.5,y:.66,type:'goldmine',hp:260,max:260},
{x:.34,y:.64,type:'elixir',hp:260,max:260},
{x:.66,y:.64,type:'barracks',hp:360,max:360}
],deployed:0,done:false,started:Date.now(),stars:0};wrap.style.display='none';panelOpen=false;$('battleHud').style.display='block';$('bottom').style.display='none';$('menuBtn').textContent='✕';$('deploy').textContent=`Tap battlefield to deploy · ${state.troops} troops`;toast('Tap inside the enemy base to deploy troops')}
function endBattle(){const b=state.battle;if(!b||b.done)return;b.done=true;mode='village';$('battleHud').style.display='none';$('bottom').style.display='flex';$('menuBtn').textContent='☰';let destroyed=b.enemies.filter(e=>e.hp<=0).length;let pct=Math.round(destroyed/b.enemies.length*100);let stars=(pct>=50?1:0)+(pct>=80?1:0)+(b.enemies[0].hp<=0?1:0);state.trophies+=stars*5;state.gold+=Math.round(pct*2+100);state.elixir+=Math.round(pct+60);state.wins+=stars>0?1:0;state.best=Math.max(state.best,pct);state.tasks.attack=true;state.battle=null;updateHud();save();showPanel(`<h2 class="title">${stars?'🏆 RAID COMPLETE':'🛡️ RAID ENDED'}</h2><p class="muted">Your warriors fought bravely. Every raid brings resources home.</p><div class="stats"><div class="card"><span class="emoji">⭐</span><strong>${stars}/3</strong><small>Stars earned</small></div><div class="card"><span class="emoji">💥</span><strong>${pct}%</strong><small>Destruction</small></div><div class="card"><span class="emoji">🪙</span><strong>+${Math.round(pct*2+100)}</strong><small>Gold loot</small></div></div><div class="btnrow"><button class="btn" id="again">NEXT RAID</button><button class="btn gold" id="home">VILLAGE</button></div>`);$('again').onclick=startBattle;$('home').onclick=()=>{closePanel();mode='village'}}
function updateBattle(dt){const b=state.battle;if(!b||b.done)return;b.time=Math.max(0,90-(Date.now()-b.started)/1000);$('timer').textContent=Math.ceil(b.time);let destroyed=b.enemies.filter(e=>e.hp<=0).length;$('percent').textContent=Math.round(destroyed/b.enemies.length*100);$('stars').textContent=(destroyed>=3?1:0)+(destroyed>=5?1:0)+(b.enemies[0].hp<=0?1:0);
 b.units.forEach(u=>{if(u.dead)return;let targets=b.enemies.filter(e=>e.hp>0);if(!targets.length){u.dead=true;return}let t=targets.sort((a,c)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(c.x-u.x,c.y-u.y))[0];let dx=t.x-u.x,dy=t.y-u.y,dist=Math.hypot(dx,dy);if(dist>.06){u.x+=dx/dist*dt*.06;u.y+=dy/dist*dt*.06}else{t.hp-=dt*48;if(t.hp<0)t.hp=0}if(Math.random()<dt*.18)u.hp-=1;});
 b.units=b.units.filter(u=>!u.dead&&u.hp>0);
 if(Math.random()<dt*.28){let live=b.units;if(live.length){let u=live[Math.floor(Math.random()*live.length)];u.hp-=1}}
 if(b.time<=0||(!b.units.length&&b.deployed>0)||b.enemies.every(e=>e.hp<=0))endBattle();
}
let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;
 if(mode==='battle')updateBattle(dt);
 else {let elapsed=(Date.now()-state.lastTick)/1000;if(elapsed>=1){let secs=Math.min(elapsed,5);state.gold+=state.buildings.filter(b=>b.type==='goldmine').reduce((a,b)=>a+(.35*b.level),0)*secs;state.elixir+=state.buildings.filter(b=>b.type==='elixir').reduce((a,b)=>a+(.3*b.level),0)*secs;state.lastTick=Date.now();updateHud()}}
 requestAnimationFrame(loop)}requestAnimationFrame(loop);
function point(e){let r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{if(panelOpen)return;let p=point(e);if(mode==='battle'){const b=state.battle;if(!b||b.done)return;if(p.x>W*.06&&p.x<W*.94&&p.y>H*.25&&p.y<H*.82&&b.deployed<state.troops){b.units.push({x:p.x/W,y:p.y/H,hp:4});b.deployed++;$('deploy').textContent=`Troops deployed: ${b.deployed}/${state.troops}`;if(b.deployed>=state.troops)$('deploy').textContent='All troops deployed!';}return}
 if(selectedBuild){if(typeof selectedBuild==='string'&&selectedBuild.startsWith('move:')){let id=+selectedBuild.split(':')[1],b=state.buildings.find(x=>x.id===id);if(b){b.x=p.x/W;b.y=p.y/H;toast('Building moved');}selectedBuild=null;return}
 let type=selectedBuild,d=buildingDefs[type];if(state.gold<d.cost){toast('Not enough gold');selectedBuild=null;return}
 let tooClose=state.buildings.some(b=>Math.hypot((b.x*W-p.x)/W*1.4,(b.y*H-p.y)/H) < .085);
 if(p.y<H*.18||p.y>H*.88||tooClose){toast('Choose a clear spot inside your village');return}
 state.gold-=d.cost;state.buildings.push({id:Date.now(),type,x:p.x/W,y:p.y/H,level:1,hp:d.hp});state.tasks.build=true;selectedBuild=null;updateHud();toast(d.name+' built!');save();return}
 let nearest=null,best=Infinity;for(const b of state.buildings){let q=bpos(b),dist=Math.hypot(q.x-p.x,q.y-p.y);if(dist<Math.min(W,H)*.095&&dist<best){nearest=b;best=dist}}
 if(nearest)upgradePanel(nearest);
});
$('menuBtn').onclick=()=>{if(mode==='battle'){if(confirm('Leave this raid?')){state.battle=null;mode='village';$('battleHud').style.display='none';$('bottom').style.display='flex';menuBtn.textContent='☰';menu()}}else menu()};
document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{if(panelOpen)return;let a=btn.dataset.action;if(a==='shop')shopPanel();if(a==='army')armyPanel();if(a==='attack')startBattle();if(a==='tasks')taskPanel();if(a==='save')save()});
function taskPanel(){showPanel(`<h2 class="title">Village Tasks</h2><p class="muted">Complete tasks to keep your kingdom growing.</p><div class="row"><span>🏗️ Build or upgrade a building</span><b>${state.tasks.build?'✅':'⬜'}</b></div><div class="row"><span>⚔️ Train troops</span><b>${state.tasks.train?'✅':'⬜'}</b></div><div class="row"><span>🛡️ Launch a raid</span><b>${state.tasks.attack?'✅':'⬜'}</b></div><div class="btnrow"><button class="btn dark" id="back">BACK</button></div>`);$('back').onclick=closePanel}
updateHud();
if(!load()){state.buildings=initBuildings();menu()}else menu();
})();
</script>
</body></html>
